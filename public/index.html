<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="把项目背景整理成可直接交给 AI 的结构化提示词。">
  <title>OrangeVC · AI 项目提示词生成器</title>
  <style>
    :root{color-scheme:light;--orange:#ff7300;--orange-dark:#d95200;--soft:#fff0df;--cream:#fffaf3;--ink:#2b2118;--muted:#74675c;--line:#eadfd2;--card:rgba(255,255,255,.9);--shadow:0 22px 60px rgba(100,55,15,.12)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 5% 5%,rgba(255,174,76,.24),transparent 30rem),radial-gradient(circle at 95% 10%,rgba(255,115,0,.12),transparent 26rem),var(--cream)}button,input,textarea,select{font:inherit}.shell{width:min(1420px,calc(100% - 36px));margin:0 auto;padding:26px 0 48px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.02em}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--orange);color:white;box-shadow:0 10px 24px rgba(255,115,0,.28);font-size:22px}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#18a66a;box-shadow:0 0 0 5px rgba(24,166,106,.12)}.hero{margin:24px 0 30px;max-width:840px}.eyebrow{color:var(--orange-dark);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase}h1{margin:12px 0;font-size:clamp(38px,5vw,68px);line-height:1.04;letter-spacing:-.055em}.hero p{margin:0;max-width:680px;color:var(--muted);font-size:17px;line-height:1.75}.grid{display:grid;grid-template-columns:minmax(320px,.88fr) minmax(420px,1.12fr);gap:22px;align-items:start}.card{border:1px solid rgba(219,198,176,.7);border-radius:24px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(14px);overflow:hidden}.card-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.card-head h2{margin:0;font-size:18px;letter-spacing:-.02em}.count{color:var(--muted);font-size:12px}.form-body{padding:22px 24px 24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;margin:0 0 7px;font-size:13px;font-weight:750}textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;background:#fffdfa;color:var(--ink);outline:none;transition:.2s border,.2s box-shadow}textarea{min-height:88px;padding:12px 13px;resize:vertical;line-height:1.55}select{height:46px;padding:0 12px}textarea:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,115,0,.1)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:22px 24px 0}.toggle{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fffdfa}.toggle span{font-size:13px;font-weight:700}.toggle input{width:18px;height:18px;accent-color:var(--orange)}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:18px 24px 24px}.btn{min-height:46px;border:0;border-radius:13px;padding:0 14px;cursor:pointer;font-weight:800;transition:transform .15s,opacity .15s,box-shadow .15s}.btn:hover{transform:translateY(-1px)}.btn:disabled{cursor:wait;opacity:.55;transform:none}.primary{color:white;background:var(--orange);box-shadow:0 10px 24px rgba(255,115,0,.26)}.secondary{color:var(--ink);background:var(--soft)}.ghost{color:var(--muted);background:#f5efe8}.result-card{min-height:640px}.result-actions{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);border-radius:10px;background:white;color:var(--muted);padding:8px 11px;cursor:pointer;font-size:12px;font-weight:700}.result{min-height:560px;max-height:72vh;overflow:auto;padding:24px;white-space:pre-wrap;word-break:break-word;font:14px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;color:#3a3028}.empty{height:540px;display:grid;place-items:center;text-align:center;color:var(--muted);font-family:inherit}.empty-orb{width:74px;height:74px;display:grid;place-items:center;margin:0 auto 18px;border-radius:24px;background:var(--soft);font-size:34px;transform:rotate(-4deg)}.empty strong{display:block;color:var(--ink);margin-bottom:8px;font-size:17px}.notice{display:none;position:fixed;right:24px;bottom:24px;max-width:min(420px,calc(100% - 48px));padding:14px 16px;border-radius:14px;color:white;background:#342820;box-shadow:var(--shadow);z-index:10;font-size:14px}.notice.show{display:block;animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translateY(8px)}}@media(max-width:980px){.grid{grid-template-columns:1fr}.result-card{min-height:520px}.result{min-height:440px}}@media(max-width:620px){.shell{width:min(100% - 22px,1420px);padding-top:16px}.topbar{align-items:flex-start}.status{display:none}.fields,.controls{grid-template-columns:1fr}.toggle{grid-column:auto}.actions{grid-template-columns:1fr}.card-head,.form-body,.controls,.actions,.result{padding-left:17px;padding-right:17px}h1{font-size:42px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="mark">🍊</div><div>OrangeVC<small>Build with clarity</small></div></div><div class="status"><span class="dot" id="healthDot"></span><span id="healthText">正在连接生成服务</span></div></header>
    <section class="hero"><div class="eyebrow">AI Project Copilot</div><h1>把模糊想法，变成<br>AI 真能执行的提示词。</h1><p>填写你已经知道的项目信息，选择一个工作阶段，即可生成结构清晰、可以直接复制给 AI 的项目提示词。</p></section>
    <section class="grid">
      <article class="card"><div class="card-head"><h2>01 · 项目信息</h2><span class="count" id="fieldCount">已填写 0/9</span></div><form id="profileForm" class="form-body"><div class="fields" id="fields"></div></form></article>
      <div>
        <article class="card"><div class="card-head"><h2>02 · 生成方式</h2><span class="count">自动保存在当前浏览器</span></div><div class="controls"><div><label for="stage">工作阶段</label><select id="stage"></select></div><div><label for="mode">提示词模式</label><select id="mode"><option value="standalone">结合项目信息</option><option value="pure">只用标准模板</option></select></div><label class="toggle"><span>使用 AI 增强（需配置环境变量）</span><input id="useLlm" type="checkbox"></label></div><div class="actions"><button class="btn primary" data-action="single">生成当前阶段</button><button class="btn secondary" data-action="master">生成总提示词</button><button class="btn ghost" data-action="all">生成全部阶段</button></div></article>
        <article class="card result-card" style="margin-top:22px"><div class="card-head"><h2 id="resultTitle">03 · 生成结果</h2><div class="result-actions"><button class="icon-btn" id="copyBtn">复制</button><button class="icon-btn" id="downloadBtn">下载</button></div></div><div class="result" id="result"><div class="empty"><div><div class="empty-orb">✦</div><strong>结果会出现在这里</strong><span>先填写左侧信息，再选择一种生成方式。</span></div></div></div></article>
      </div>
    </section>
  </main>
  <div class="notice" id="notice"></div>
  <script>
    const fieldDefs=[["project_goal","项目目标","这个项目整体要解决什么问题？"],["current_task","本次任务","这一次具体想让 AI 完成什么？"],["impact_scope","影响范围","会涉及哪些页面、模块或用户？"],["known_issues","已知问题","目前遇到了什么现象或报错？"],["related_files_modules","相关文件或模块","可以填写文件名、模块或接口。"],["environment_info","环境信息","例如 Windows、Python 3.12。"],["time_constraints","时间或交付要求","何时完成，需要交付什么？"],["success_criteria","成功标准","达到什么效果才算完成？"],["risk_preference","速度与风险偏好","更重视速度还是稳定？"]];
    const stageNames=["提供项目背景与上下文","理解需求","定义成功标准","明确约束、风险与非目标","创建任务计划","尽量使用测试驱动开发","最小化实现","分层验证","本地人工测试","独立审查","变更摘要与提交准备","干净提交","推送并创建合并请求","观察 CI、部署与失败闭环"];
    const storageKey="orangevc-prompt-profile-v1",fieldsEl=document.querySelector("#fields"),resultEl=document.querySelector("#result");let lastText="";
    fieldDefs.forEach(([name,label,placeholder])=>{const wrap=document.createElement("div");wrap.innerHTML=`<label for="${name}">${label}</label><textarea id="${name}" name="${name}" placeholder="${placeholder}"></textarea>`;fieldsEl.appendChild(wrap)});stageNames.forEach((name,id)=>document.querySelector("#stage").add(new Option(`${id}. ${name}`,id)));
    const getProfile=()=>Object.fromEntries(fieldDefs.map(([name])=>[name,document.querySelector(`#${name}`).value.trim()]));
    function saveProfile(){const profile=getProfile();localStorage.setItem(storageKey,JSON.stringify(profile));document.querySelector("#fieldCount").textContent=`已填写 ${Object.values(profile).filter(Boolean).length}/9`}
    function restoreProfile(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||"{}");fieldDefs.forEach(([name])=>document.querySelector(`#${name}`).value=saved[name]||"")}catch(_){}saveProfile()}
    function toast(message){const el=document.querySelector("#notice");el.textContent=message;el.classList.add("show");clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>el.classList.remove("show"),2600)}
    const setLoading=loading=>document.querySelectorAll(".btn").forEach(button=>button.disabled=loading);
    const payload=()=>({profile:getProfile(),mode:document.querySelector("#mode").value,use_llm:document.querySelector("#useLlm").checked});
    const formatAll=data=>data.prompts.map(item=>`# ${item.stage_id}. ${item.stage_name}\n\n${item.prompt_text}`).join("\n\n---\n\n");
    async function generate(action){saveProfile();setLoading(true);resultEl.textContent="正在生成，请稍候…";const body=payload();if(action==="single")body.stage_id=Number(document.querySelector("#stage").value);try{const response=await fetch(`/api/generate/${action}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),data=await response.json();if(!response.ok)throw new Error(data.detail||"生成失败");lastText=action==="all"?formatAll(data):data.prompt_text;resultEl.textContent=lastText;document.querySelector("#resultTitle").textContent=`03 · ${action==="single"?data.stage_name:action==="master"?"总提示词":"全部阶段"}`}catch(error){lastText="";resultEl.textContent=`生成失败：${error.message}`;toast(error.message)}finally{setLoading(false)}}
    document.querySelector("#profileForm").addEventListener("input",saveProfile);document.querySelectorAll("[data-action]").forEach(button=>button.addEventListener("click",()=>generate(button.dataset.action)));document.querySelector("#copyBtn").addEventListener("click",async()=>{if(!lastText)return toast("还没有可复制的结果");await navigator.clipboard.writeText(lastText);toast("已复制到剪贴板")});document.querySelector("#downloadBtn").addEventListener("click",()=>{if(!lastText)return toast("还没有可下载的结果");const url=URL.createObjectURL(new Blob([lastText],{type:"text/markdown;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="orangevc-prompt.md";a.click();URL.revokeObjectURL(url)});
    restoreProfile();fetch("/api/health").then(r=>{if(!r.ok)throw new Error();document.querySelector("#healthText").textContent="生成服务已连接"}).catch(()=>{document.querySelector("#healthDot").style.background="#d95b4f";document.querySelector("#healthText").textContent="生成服务未连接"});
  </script>
</body>
</html>
